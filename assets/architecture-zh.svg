<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crush.skill 中文技术架构图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/></marker>
    <style>
      .title{font:800 34px ui-sans-serif, system-ui, sans-serif; fill:#111827}.sub{font:600 17px ui-sans-serif, system-ui, sans-serif; fill:#64748b}.boxTitle{font:800 20px ui-sans-serif, system-ui, sans-serif; fill:#172033}.boxText{font:600 15px ui-sans-serif, system-ui, sans-serif; fill:#475569}.tiny{font:700 13px ui-sans-serif, system-ui, sans-serif; fill:#64748b}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text class="title" x="70" y="66">Crush.skill 技术架构</text>
  <text class="sub" x="70" y="96">Agent Skill 与本地 CLI 共用同一套 runtime、状态机、记忆和报告引擎。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="142" width="260" height="104" rx="22" fill="#ffffff" stroke="#bae6fd"/><text class="boxTitle" x="96" y="180">入口层</text><text class="boxText" x="96" y="208">Claude Code / OpenClaw</text><text class="boxText" x="96" y="232">QwenPaw / Standalone CLI</text>
    <rect x="450" y="142" width="260" height="104" rx="22" fill="#ffffff" stroke="#fecdd3"/><text class="boxTitle" x="476" y="180">动作路由</text><text class="boxText" x="476" y="208">execute.py / manifest</text><text class="boxText" x="476" y="232">slash commands / CLI commands</text>
    <rect x="830" y="142" width="260" height="104" rx="22" fill="#ffffff" stroke="#fde68a"/><text class="boxTitle" x="856" y="180">输出契约</text><text class="boxText" x="856" y="208">隐藏 runtime_prompt</text><text class="boxText" x="856" y="232">只向用户展示自然回复</text>
  </g>
  <path class="line" d="M330 194 H440"/><path class="line" d="M710 194 H820"/>

  <g filter="url(#shadow)">
    <rect x="70" y="330" width="210" height="116" rx="22" fill="#fff1f2" stroke="#fb7185"/><text class="boxTitle" x="94" y="368">聊天导入</text><text class="boxText" x="94" y="396">微信 / WhatsApp / QQ</text><text class="boxText" x="94" y="420">CSV / 粘贴文本</text>
    <rect x="318" y="330" width="210" height="116" rx="22" fill="#ecfeff" stroke="#22d3ee"/><text class="boxTitle" x="342" y="368">人格引擎</text><text class="boxText" x="342" y="396">5 层人格模型</text><text class="boxText" x="342" y="420">表达 DNA / 边界</text>
    <rect x="566" y="330" width="210" height="116" rx="22" fill="#fffbeb" stroke="#f59e0b"/><text class="boxTitle" x="590" y="368">语义读秒</text><text class="boxText" x="590" y="396">梗 / 潜台词 / 软拒绝</text><text class="boxText" x="590" y="420">需求感 / 压力识别</text>
    <rect x="814" y="330" width="210" height="116" rx="22" fill="#f0fdf4" stroke="#22c55e"/><text class="boxTitle" x="838" y="368">状态机</text><text class="boxText" x="838" y="396">好感 / 张力 / 防御</text><text class="boxText" x="838" y="420">主动性 / 时间线</text>
  </g>
  <path class="line" d="M580 246 V306"/><path class="line" d="M580 306 H175 V326"/><path class="line" d="M580 306 H423 V326"/><path class="line" d="M580 306 H671 V326"/><path class="line" d="M580 306 H919 V326"/>

  <g filter="url(#shadow)">
    <rect x="156" y="548" width="250" height="116" rx="22" fill="#ffffff" stroke="#cbd5e1"/><text class="boxTitle" x="182" y="586">记忆系统</text><text class="boxText" x="182" y="614">SQLite source-of-truth</text><text class="boxText" x="182" y="638">本地检索 / 摘要 / 可选 mem0</text>
    <rect x="475" y="548" width="250" height="116" rx="22" fill="#ffffff" stroke="#cbd5e1"/><text class="boxTitle" x="501" y="586">关系蒸馏报告</text><text class="boxText" x="501" y="614">证据地图 / 关系雷达</text><text class="boxText" x="501" y="638">训练建议 / 验证限制</text>
    <rect x="794" y="548" width="250" height="116" rx="22" fill="#ffffff" stroke="#cbd5e1"/><text class="boxTitle" x="820" y="586">角色回应</text><text class="boxText" x="820" y="614">宿主模型或 CLI 模型生成</text><text class="boxText" x="820" y="638">record_reply 写回长期记忆</text>
  </g>
  <path class="line" d="M423 446 V538"/><path class="line" d="M671 446 V538"/><path class="line" d="M919 446 V538"/>
  <path class="line" d="M406 606 H464"/><path class="line" d="M725 606 H783"/>
  <text class="tiny" x="70" y="718">原则：规则引擎负责状态和证据，LLM 负责自然表达；SQLite 永远是本地记忆源。</text>
</svg>
