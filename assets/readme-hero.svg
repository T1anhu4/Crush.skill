<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crush.skill animated hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.45" stop-color="#ffe4e6"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#fff1f2" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#9f1239" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:800 58px Georgia, 'Times New Roman', serif; fill:#111827; letter-spacing:-1px}
      .sub{font:500 22px ui-sans-serif, system-ui, sans-serif; fill:#475569}
      .small{font:600 17px ui-sans-serif, system-ui, sans-serif; fill:#64748b}
      .mono{font:600 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#0f172a}
      .pill{font:700 15px ui-sans-serif, system-ui, sans-serif; fill:#881337}
      .bubble{font:600 19px ui-sans-serif, system-ui, sans-serif; fill:#1f2937}
      .readout{font:700 16px ui-sans-serif, system-ui, sans-serif; fill:#92400e}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes slide{0%{transform:translateX(-24px);opacity:.25}35%,100%{transform:translateX(0);opacity:1}}
      .floatA{animation:floatA 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
      .floatB{animation:floatB 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .slide{animation:slide 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
    </style>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle class="floatA" cx="1040" cy="92" r="94" fill="#fb7185" opacity="0.18"/>
  <circle class="floatB" cx="132" cy="430" r="120" fill="#38bdf8" opacity="0.16"/>
  <path d="M810 480 C960 386 1048 410 1200 320 L1200 520 L810 520 Z" fill="#fda4af" opacity="0.22"/>

  <g transform="translate(78 82)">
    <text class="title" x="0" y="0">Crush.skill</text>
    <text class="sub" x="4" y="44">A relationship flight simulator, not another chatbot.</text>
    <g transform="translate(0 84)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#fff1f2" stroke="#fb7185"/>
      <text class="pill" x="21" y="25">persona memory</text>
      <rect x="188" y="0" width="158" height="38" rx="19" fill="#ecfeff" stroke="#22d3ee"/>
      <text class="pill" x="213" y="25" fill="#155e75">timeline state</text>
      <rect x="364" y="0" width="150" height="38" rx="19" fill="#fffbeb" stroke="#f59e0b"/>
      <text class="pill" x="390" y="25" fill="#92400e">coach HUD</text>
    </g>
    <text class="small" x="4" y="174">Import real chats. Simulate tension. Learn when to push, pull, wait, or stop.</text>
    <g class="pulse" transform="translate(4 224)">
      <rect x="0" y="0" width="420" height="58" rx="18" fill="#111827" opacity="0.92"/>
      <text class="mono" x="24" y="36" fill="#f9fafb">crush › /model  ·  /language  ·  /import</text>
    </g>
  </g>

  <g filter="url(#shadow)" transform="translate(650 72)">
    <rect width="430" height="365" rx="26" fill="url(#card)"/>
    <rect x="24" y="28" width="382" height="42" rx="21" fill="#111827"/>
    <text class="mono" x="43" y="55" fill="#e5e7eb">default › 下班了下班了</text>

    <g class="slide" transform="translate(28 104)">
      <rect x="0" y="0" width="350" height="82" rx="22" fill="#ffffff" stroke="#fecdd3"/>
      <text class="small" x="272" y="25">18:42</text>
      <text class="bubble" x="24" y="38">终于。你到哪了？</text>
      <text class="bubble" x="24" y="64">我刚好也准备走</text>
    </g>

    <g transform="translate(28 214)">
      <rect x="0" y="0" width="382" height="86" rx="20" fill="#fffbeb" stroke="#facc15"/>
      <text class="readout" x="22" y="31">Readout: light flirt · risk medium</text>
      <text class="small" x="22" y="58">Next move: answer with care, do not ask for validation.</text>
    </g>

    <g transform="translate(28 322)">
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#ecfeff" stroke="#67e8f9"/>
      <text class="small" x="18" y="22">waiting state</text>
      <rect x="200" y="0" width="180" height="32" rx="16" fill="#fff1f2" stroke="#fda4af"/>
      <text class="small" x="218" y="22">warmth + initiative</text>
    </g>
  </g>
</svg>
