<svg width="1200" height="790" viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crush.skill English architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/></marker>
    <style>.title{font:800 35px ui-sans-serif,system-ui,sans-serif;fill:#111827}.sub{font:650 18px ui-sans-serif,system-ui,sans-serif;fill:#64748b}.boxTitle{font:800 20px ui-sans-serif,system-ui,sans-serif;fill:#172033}.boxText{font:650 15px ui-sans-serif,system-ui,sans-serif;fill:#475569}.tiny{font:800 15px ui-sans-serif,system-ui,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="790" rx="32" fill="url(#bg)"/>
  <text class="title" x="70" y="66">Crush.skill Architecture</text>
  <text class="sub" x="70" y="98">Agent Skill and local CLI share one runtime, state engine, memory layer, and report engine.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="132" width="270" height="124" rx="22" fill="#fff" stroke="#bae6fd"/><text class="boxTitle" x="96" y="170">Entry Layer</text><text class="boxText" x="96" y="200">Claude Code / OpenClaw</text><text class="boxText" x="96" y="226">QwenPaw / Standalone CLI</text>
    <rect x="430" y="132" width="300" height="124" rx="22" fill="#fff" stroke="#fecdd3"/><text class="boxTitle" x="456" y="170">Action Router</text><text class="boxText" x="456" y="198">execute.py / manifest</text><text class="boxText" x="456" y="222">slash commands</text><text class="boxText" x="456" y="246">CLI commands</text>
    <rect x="840" y="132" width="270" height="124" rx="22" fill="#fff" stroke="#fde68a"/><text class="boxTitle" x="866" y="170">Output Contract</text><text class="boxText" x="866" y="200">hidden runtime_prompt</text><text class="boxText" x="866" y="226">natural reply only</text>
  </g>
  <path class="line" d="M340 194 H420"/><path class="line" d="M730 194 H830"/>

  <g filter="url(#shadow)">
    <rect x="56" y="340" width="230" height="124" rx="22" fill="#fff1f2" stroke="#fb7185"/><text class="boxTitle" x="82" y="378">Chat Import</text><text class="boxText" x="82" y="406">WeChat / WhatsApp / QQ</text><text class="boxText" x="82" y="430">CSV / pasted transcript</text>
    <rect x="316" y="340" width="230" height="124" rx="22" fill="#ecfeff" stroke="#22d3ee"/><text class="boxTitle" x="342" y="378">Persona Engine</text><text class="boxText" x="342" y="406">5-layer persona model</text><text class="boxText" x="342" y="430">expression DNA</text><text class="boxText" x="342" y="454">boundaries</text>
    <rect x="576" y="340" width="230" height="124" rx="22" fill="#fffbeb" stroke="#f59e0b"/><text class="boxTitle" x="602" y="378">Pragmatics</text><text class="boxText" x="602" y="406">slang / subtext</text><text class="boxText" x="602" y="430">soft no / pressure reads</text>
    <rect x="836" y="340" width="230" height="124" rx="22" fill="#f0fdf4" stroke="#22c55e"/><text class="boxTitle" x="862" y="378">State Engine</text><text class="boxText" x="862" y="406">favorability / tension</text><text class="boxText" x="862" y="430">defense / initiative</text><text class="boxText" x="862" y="454">timeline</text>
  </g>
  <path class="line" d="M580 256 V315"/><path class="line" d="M580 315 H171 V336"/><path class="line" d="M580 315 H431 V336"/><path class="line" d="M580 315 H691 V336"/><path class="line" d="M580 315 H951 V336"/>

  <g filter="url(#shadow)">
    <rect x="134" y="574" width="280" height="124" rx="22" fill="#fff" stroke="#cbd5e1"/><text class="boxTitle" x="160" y="612">Memory System</text><text class="boxText" x="160" y="640">SQLite source-of-truth</text><text class="boxText" x="160" y="664">local retrieval / summary</text><text class="boxText" x="160" y="688">optional mem0</text>
    <rect x="460" y="574" width="280" height="124" rx="22" fill="#fff" stroke="#cbd5e1"/><text class="boxTitle" x="486" y="612">Distillation Report</text><text class="boxText" x="486" y="640">evidence map / radar</text><text class="boxText" x="486" y="664">playbook / validation limits</text>
    <rect x="786" y="574" width="280" height="124" rx="22" fill="#fff" stroke="#cbd5e1"/><text class="boxTitle" x="812" y="612">Persona Reply</text><text class="boxText" x="812" y="640">host or CLI model</text><text class="boxText" x="812" y="664">record_reply writes</text><text class="boxText" x="812" y="688">memory back</text>
  </g>
  <path class="line" d="M431 464 V564"/><path class="line" d="M691 464 V564"/><path class="line" d="M951 464 V564"/><path class="line" d="M414 636 H450"/><path class="line" d="M740 636 H776"/>
  <text class="tiny" x="70" y="746">Principle: rules compute state and evidence; LLMs produce natural expression; SQLite remains the local memory source.</text>
</svg>
